name: build-dist

on:
  push:
    branches:
      - feat/windui-ui-optimize
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/windui-ui-optimize

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Build bundle
        run: luajit tools/bundle.lua --native

      - name: Verify bundle
        run: luajit tools/bundle.lua --check

      - name: Commit generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/uai.lua dist/uai.manifest.json
          if git diff --cached --quiet; then
            echo "dist is already current"
          else
            git commit -m "build: regenerate UAI dist bundle"
            git push origin HEAD:feat/windui-ui-optimize
          fi
